<!doctype html>
<meta charset="utf-8">
<title>Unit tests</title>
<script type="module">
  import { parseWeight, formatSet, formatSetCount, formatDuration, formatClock, formatCountdown, greeting } from '/js/format.js';
  import { monthDays, workoutsByDay, addMonths } from '/js/calendar.js';
  import { prFlags, isPr } from '/js/records.js';
  import * as store from '/js/store.js';
  import { accountEmail, useAccount, forgetAccount } from '/js/account.js';
  const { applyOps } = store;

  const results = [];
  const test = (name, fn) => {
    try { fn(); results.push({ name, ok: true }); } catch (e) { results.push({ name, ok: false, error: String(e) }); }
  };
  const eq = (actual, expected) => {
    const a = JSON.stringify(actual);
    const b = JSON.stringify(expected);
    if (a !== b) throw new Error(`expected ${b} but got ${a}`);
  };
  const empty = () => ({ exercises: [], activeSession: null, history: [], weekly: null, exerciseStats: {}, sessionDetails: {} });
  const start = { kind: 'session.start', payload: { id: 's1', date: '2026-10-05', startedAt: '2026-10-05T08:00:00.000Z' } };
  const squat = { kind: 'exercise.put', payload: { id: 'e1', name: 'Squat', muscleGroup: 'QUADS' } };
  const set = (id, weightKg, reps, loggedAt, type = 'WORK') =>
    ({ kind: 'set.put', payload: { id, sessionId: 's1', exerciseId: 'e1', weightKg, reps, type, loggedAt } });

  test('parseWeight accepts dot and comma decimals', () => {
    eq(parseWeight('42.5'), 42.5);
    eq(parseWeight('42,5'), 42.5);
    eq(parseWeight(' 60 '), 60);
  });
  test('parseWeight rounds to 0.25 and clamps to 0–500', () => {
    eq(parseWeight('42.3'), 42.25);
    eq(parseWeight('-5'), 0);
    eq(parseWeight('900'), 500);
  });
  test('parseWeight rejects text that is not a number', () => {
    eq(parseWeight(''), null);
    eq(parseWeight('abc'), null);
  });
  test('formatSet shows kilograms or bodyweight', () => {
    eq(formatSet(40, 10), '40 kg × 10');
    eq(formatSet('42.50', 8), '42.5 kg × 8');
    eq(formatSet(42.25, 5), '42.25 kg × 5');
    eq(formatSet(0, 12), 'Bodyweight × 12');
  });
  test('formatSetCount', () => {
    eq(formatSetCount(1), '1 set');
    eq(formatSetCount(3), '3 sets');
  });
  test('time formats', () => {
    eq(formatDuration(2400), '40 min');
    eq(formatDuration(3900), '1 h 05 min');
    eq(formatClock(2537), '0:42:17');
    eq(formatCountdown(90), '1:30');
    eq(formatCountdown(0.2), '0:01');
  });
  test('applyOps: create an exercise and log a set while offline', () => {
    const state = applyOps(empty(), [squat, start, set('x1', 40, 10, '2026-10-05T08:10:00.000Z')]);
    eq(state.exercises.map((e) => e.name), ['Squat']);
    eq(state.activeSession.sets.map((s) => [s.exerciseName, s.weightKg]), [['Squat', 40]]);
  });
  test('applyOps: ending moves the session to history', () => {
    const state = applyOps(empty(), [squat, start, set('x1', 40, 10, '2026-10-05T08:10:00.000Z'),
      { kind: 'session.end', payload: { id: 's1', endedAt: '2026-10-05T08:42:00.000Z' } }]);
    eq(state.activeSession, null);
    eq([state.history[0].durationSeconds, state.history[0].setCount, state.history[0].muscleGroups], [2520, 1, ['QUADS']]);
  });
  test('applyOps: ending an empty session discards it', () => {
    const state = applyOps(empty(), [start, { kind: 'session.end', payload: { id: 's1', endedAt: '2026-10-05T08:01:00.000Z' } }]);
    eq([state.activeSession, state.history.length], [null, 0]);
  });
  test('applyOps: editing and deleting sets and exercises', () => {
    const state = applyOps(empty(), [squat, start,
      set('x1', 40, 10, '2026-10-05T08:10:00.000Z'),
      set('x1', 42.5, 8, '2026-10-05T08:10:00.000Z'),
      set('x2', 40, 10, '2026-10-05T08:12:00.000Z'),
      { kind: 'set.delete', payload: { id: 'x2' } },
      { kind: 'exercise.put', payload: { id: 'e2', name: 'Bench', muscleGroup: 'CHEST' } },
      { kind: 'exercise.delete', payload: { id: 'e2' } }]);
    eq(state.activeSession.sets.map((s) => [s.id, s.weightKg, s.reps]), [['x1', 42.5, 8]]);
    eq(state.exercises.map((e) => e.id), ['e1']);
  });
  test('applyOps: sets are ordered by time even when timestamp formats differ', () => {
    const state = applyOps(empty(), [squat, start,
      set('server', 40, 10, '2026-10-05T08:10:00Z'),
      set('phone', 40, 10, '2026-10-05T08:09:59.500Z')]);
    eq(state.activeSession.sets.map((s) => s.id), ['phone', 'server']);
  });

  test('store: a change the server accepted stays visible until fresh server data arrives', () => {
    store.dispatch('exercise.put', { id: 'ack1', name: 'Ack', muscleGroup: 'CORE' });
    store.shift(); // the server accepted it; the snapshot does not have it yet
    eq(store.view().exercises.filter((e) => e.id === 'ack1').length, 1);
    store.applyServerSnapshot({ exercises: [] }, store.ackedIds());
    eq(store.view().exercises.filter((e) => e.id === 'ack1').length, 0);
  });
  test('store: changes accepted during a refresh survive that refresh', () => {
    const before = store.ackedIds();
    store.dispatch('exercise.put', { id: 'ack2', name: 'Late', muscleGroup: 'CORE' });
    store.shift();
    store.applyServerSnapshot({ exercises: [] }, before);
    eq(store.view().exercises.filter((e) => e.id === 'ack2').length, 1);
  });

  const ws = (id, weightKg, reps, minute, type = 'WORK') =>
    ({ id, exerciseId: 'e1', weightKg, reps, type, loggedAt: `2026-10-05T08:${minute}:00.000Z` });
  const history = { e1: {
    heaviest: { weightKg: '60.00', reps: 5, date: '2026-09-28' },
    repRecords: [{ weightKg: '60.00', reps: 5 }, { weightKg: '40.00', reps: 10 }, { weightKg: '0.00', reps: 20 }],
  } };

  test('prFlags: heavier than ever is a heaviest-weight PR', () => {
    eq(prFlags([ws('a', 62.5, 3, '10')], history).get('a'), { heaviest: true, reps: false });
  });
  test('prFlags: more reps at a weight done before is a rep PR', () => {
    eq(prFlags([ws('a', 40, 12, '10')], history).get('a'), { heaviest: false, reps: true });
  });
  test('prFlags: equal reps, or a lighter weight never done before, is no PR', () => {
    const flags = prFlags([ws('a', 40, 10, '10'), ws('b', 30, 5, '11')], history);
    eq([isPr(flags.get('a')), isPr(flags.get('b'))], [false, false]);
  });
  test('prFlags: bodyweight can be a rep PR but never a heaviest PR', () => {
    eq(prFlags([ws('a', 0, 25, '10')], history).get('a'), { heaviest: false, reps: true });
  });
  test('prFlags: the first set ever of an exercise is no PR', () => {
    eq(isPr(prFlags([ws('a', 40, 10, '10')], {}).get('a')), false);
  });
  test('prFlags: earlier sets in the same session count as history', () => {
    const flags = prFlags([ws('a', 40, 10, '10'), ws('b', 40, 11, '11'), ws('c', 45, 5, '12')], {});
    eq([isPr(flags.get('a')), flags.get('b'), flags.get('c')], [false, { heaviest: false, reps: true }, { heaviest: true, reps: false }]);
  });
  test('prFlags: warmups are never PRs and do not count as history', () => {
    const flags = prFlags([ws('w', 100, 1, '09', 'WARMUP'), ws('a', 40, 10, '10')], {});
    eq([flags.has('w'), isPr(flags.get('a'))], [false, false]);
  });
  test('prFlags: order follows loggedAt, not array order', () => {
    const flags = prFlags([ws('late', 45, 5, '12'), ws('early', 40, 10, '10')], {});
    eq([isPr(flags.get('early')), flags.get('late').heaviest], [false, true]);
  });

  test('useAccount keeps the same account\'s data and wipes another account\'s', () => {
    forgetAccount();
    useAccount('a@example.com');
    store.dispatch('exercise.put', { id: 'e9', name: 'Plank', muscleGroup: 'CORE' });
    useAccount('a@example.com');
    eq([store.pending(), store.view().exercises.length], [1, 1]);
    useAccount('b@example.com');
    eq([store.pending(), store.view().exercises.length, accountEmail()], [0, 0, 'b@example.com']);
    forgetAccount();
    eq([accountEmail(), store.pending()], [null, 0]);
  });

  test('greeting follows the time of day', () => {
    const at = (h, m = 0) => new Date(2026, 9, 7, h, m);
    eq([at(4, 59), at(5), at(11, 59), at(12), at(17, 59), at(18), at(23, 59)].map((d) => greeting(d, null)),
      ['Good evening', 'Good morning', 'Good morning', 'Good afternoon', 'Good afternoon', 'Good evening', 'Good evening']);
  });
  test('greeting adds the name when there is one', () => {
    const morning = new Date(2026, 9, 7, 9);
    eq(greeting(morning, 'Janet'), 'Good morning, Janet');
    eq(greeting(morning, '  '), 'Good morning');
    eq(greeting(morning, undefined), 'Good morning');
  });
  test('monthDays: weeks start on Monday', () => {
    const october = monthDays(2026, 9); // 1 October 2026 is a Thursday
    eq([october.leading, october.days.length, october.days[0], october.days.at(-1)], [3, 31, '2026-10-01', '2026-10-31']);
    eq(monthDays(2026, 10).leading, 6); // 1 November 2026 is a Sunday
    eq([monthDays(2027, 1).leading, monthDays(2027, 1).days.length], [0, 28]); // 1 February 2027 is a Monday
    eq(monthDays(2028, 1).days.length, 29);
  });
  test('addMonths crosses years', () => {
    eq(addMonths({ year: 2026, month: 0 }, -1), { year: 2025, month: 11 });
    eq(addMonths({ year: 2026, month: 11 }, 1), { year: 2027, month: 0 });
  });
  test('workoutsByDay groups workouts by date, earliest first', () => {
    const byDay = workoutsByDay([
      { id: 'b', date: '2026-10-05', startedAt: '2026-10-05T17:00:00Z' },
      { id: 'c', date: '2026-10-01', startedAt: '2026-10-01T08:00:00Z' },
      { id: 'a', date: '2026-10-05', startedAt: '2026-10-05T07:00:00Z' },
    ]);
    eq([...byDay.keys()].sort(), ['2026-10-01', '2026-10-05']);
    eq(byDay.get('2026-10-05').map((h) => h.id), ['a', 'b']);
  });
  const finished = () => {
    const state = applyOps(empty(), [squat, { kind: 'exercise.put', payload: { id: 'e2', name: 'Bench', muscleGroup: 'CHEST' } }]);
    state.history = [{ id: 'f1', date: '2026-10-01', startedAt: '2026-10-01T08:00:00Z', endedAt: '2026-10-01T09:00:00Z',
      durationSeconds: 3600, setCount: 2, muscleGroups: ['QUADS'] }];
    state.sessionDetails = { f1: { id: 'f1', date: '2026-10-01', startedAt: '2026-10-01T08:00:00Z', endedAt: '2026-10-01T09:00:00Z', sets: [
      { id: 'p1', sessionId: 'f1', exerciseId: 'e1', exerciseName: 'Squat', muscleGroup: 'QUADS', weightKg: 60, reps: 5, type: 'WORK', loggedAt: '2026-10-01T08:10:00Z' },
      { id: 'p2', sessionId: 'f1', exerciseId: 'e1', exerciseName: 'Squat', muscleGroup: 'QUADS', weightKg: 60, reps: 5, type: 'WORK', loggedAt: '2026-10-01T08:20:00Z' },
    ] } };
    return state;
  };
  const pastSet = (id, exerciseId, weightKg, reps, loggedAt) =>
    ({ kind: 'set.put', payload: { id, sessionId: 'f1', exerciseId, weightKg, reps, type: 'WORK', loggedAt } });
  test('applyOps: editing a finished workout changes its sets and its History line', () => {
    const state = applyOps(finished(), [
      pastSet('p1', 'e1', 62.5, 5, '2026-10-01T08:10:00Z'),
      pastSet('p3', 'e2', 40, 8, '2026-10-01T08:20:01Z'),
      { kind: 'set.delete', payload: { id: 'p2' } }]);
    eq(state.sessionDetails.f1.sets.map((s) => [s.id, s.exerciseName, s.weightKg]), [['p1', 'Squat', 62.5], ['p3', 'Bench', 40]]);
    eq([state.history[0].setCount, state.history[0].muscleGroups], [2, ['QUADS', 'CHEST']]);
    eq(state.activeSession, null);
  });
  test('applyOps: deleting the last set of a finished workout deletes the workout', () => {
    const state = applyOps(finished(), [{ kind: 'set.delete', payload: { id: 'p1' } }, { kind: 'set.delete', payload: { id: 'p2' } }]);
    eq([state.history.length, state.sessionDetails.f1], [0, undefined]);
  });
  test('applyOps: deleting a finished workout removes it and its sets', () => {
    const state = applyOps(finished(), [{ kind: 'session.discard', payload: { id: 'f1' } }]);
    eq([state.history.length, state.sessionDetails.f1], [0, undefined]);
  });
  test('store: an accepted edit of a finished workout stays in its saved sets after a refresh', () => {
    const { history, sessionDetails } = finished();
    store.setSnapshot({ history, sessionDetails });
    store.dispatch('set.put', pastSet('p1', 'e1', 65, 3, '2026-10-01T08:10:00Z').payload);
    store.shift();
    store.applyServerSnapshot({ history: [{ ...history[0] }] }, store.ackedIds());
    eq(store.view().sessionDetails.f1.sets[0].weightKg, 65);
  });
  test('applyOps: a name change shows straight away', () => {
    eq(applyOps({ ...empty(), name: null }, [{ kind: 'name.put', payload: { name: 'Janet' } }]).name, 'Janet');
  });

  window.__results = results;
</script>
